[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "langflow-materials-quality"
version = "0.2.0"
description = "Non-destructive materials data quality components for Langflow"
readme = "README.md"
requires-python = ">=3.10,<3.15"
dependencies = ["pandas>=2.0,<3.0", "pint==0.24.4"]

[project.optional-dependencies]
langflow = ["lfx==1.13.0"]
dev = ["pytest>=8,<10", "ruff>=0.13", "build>=1.2"]

[tool.hatch.build.targets.wheel]
packages = ["src/materials_quality"]

[tool.hatch.build.targets.wheel.force-include]
"components" = "materials_quality/component_sources"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-ra"

[tool.ruff]
target-version = "py310"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
