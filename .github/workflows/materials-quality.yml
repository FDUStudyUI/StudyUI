name: Materials quality nodes
on: [push, pull_request]
permissions:
  contents: read
defaults:
  run:
    working-directory: packages/materials-quality
env:
  PYTHONUTF8: '1'
  MPLBACKEND: Agg
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install -r requirements.lock
      - name: Install OCR runtime libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libgl1 libglib2.0-0
      - run: python -m pip install -e .
      - run: ruff check src components tests scripts examples
      - run: python -m pytest -q
      - run: python -m scripts.build_example
      - run: python -m scripts.build_mechanics
      - run: python -m scripts.build_science_components
      - run: python -m scripts.build_requirements_matrix
      - run: python -m scripts.build_science_examples --verify
      - run: python -m scripts.run_example examples/dirty_quality_flow.json --output artifacts/dirty_report.json
      - run: python -m scripts.run_example examples/mechanics/dirty_flow.json --output artifacts/mechanics_dirty.json
      - run: python -m scripts.run_example examples/mechanics/corrected_flow.json --output artifacts/mechanics_corrected.json
      - run: python -m build --wheel
      - run: python -m pip install --force-reinstall --no-deps dist/*.whl
      - run: python -m scripts.verify_install --require-wheel
      - uses: actions/upload-artifact@v4
        with:
          name: materials-quality-verification
          path: |
            packages/materials-quality/artifacts/*.json
            packages/materials-quality/dist/*.whl
  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
      LANGFLOW_AUTO_LOGIN: 'true'
      LANGFLOW_DO_NOT_TRACK: 'true'
      LITELLM_LOCAL_MODEL_COST_MAP: 'True'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: packages/materials-quality/pyproject.toml
      - run: python -m pip install -e '.[langflow,science,dev,ui-test]'
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest tests/test_ui_selectors.py -q
      - name: Start isolated Langflow
        run: |
          mkdir -p artifacts/ui-runtime
          export LANGFLOW_COMPONENTS_PATH="$PWD/components"
          export LANGFLOW_CONFIG_DIR="$PWD/artifacts/ui-runtime"
          python -m langflow run --host 127.0.0.1 --port 7867 --no-open-browser > artifacts/ui-server.log 2>&1 &
          echo $! > artifacts/ui-server.pid
          python - <<'PY'
          import time, urllib.request
          for attempt in range(180):
              try:
                  with urllib.request.urlopen('http://127.0.0.1:7867/health', timeout=2) as response:
                      if response.status == 200:
                          break
              except OSError:
                  pass
              time.sleep(1)
          else:
              raise SystemExit('Langflow did not become healthy')
          PY
      - run: python -m scripts.ui_acceptance
      - run: python -m scripts.ui_science_acceptance
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: materials-quality-real-ui
          path: |
            packages/materials-quality/artifacts/ui-acceptance/
            packages/materials-quality/artifacts/ui-science-acceptance/
            packages/materials-quality/artifacts/ui-server.log
            packages/materials-quality/artifacts/ui-acceptance.log
