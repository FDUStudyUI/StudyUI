name: Materials quality nodes
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: materials-science-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
defaults:
  run:
    working-directory: materials-quality
env:
  PYTHONUTF8: '1'
  MPLBACKEND: Agg
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install -r requirements.lock
      - name: Install OCR runtime libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libgl1 libglib2.0-0
      - run: python -m pip install -e .
      - run: python -m pip install deepseek-harness-sdk==0.2.2rc2
      - run: ruff check src components tests scripts examples
      - run: ruff check ../scripts --config pyproject.toml
      - run: ruff format --check src components tests scripts examples
      - run: ruff format --check ../scripts --config pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check frontend and CI formatting
        run: |
          npx --yes prettier@3.3.3 --check \
            '../scripts/assets/*.html' \
            '../dsh-plugins/**/*.js' \
            '../dsh-plugins/**/*.json' \
            '../.github/workflows/*.yml' \
            ../.prettierrc.json
      - run: python -m pytest -q
      - run: python -m scripts.build_example
      - run: python -m scripts.build_mechanics
      - run: python -m scripts.build_science_components --check
      - run: python -m scripts.build_requirements_matrix
      - run: python -m scripts.build_science_examples --verify
      - run: python -m scripts.build_form_examples
      - run: python -m scripts.build_batch_examples
      - run: python -m scripts.build_research_examples
      - run: python -m scripts.build_skill_examples
      - run: python -m scripts.build_reliability_examples
      - run: python -m scripts.build_expansion_examples
      - run: python -m scripts.build_paper_examples
      - run: python -m scripts.build_demo_examples
      - run: python -m scripts.evaluate_demo_references --output artifacts/demo-reference-evaluation/result.json
      - run: python -m scripts.evaluate_agent_stability --output artifacts/agent-stability --repeats 3
      - run: python -m scripts.evaluate_material_instruments --output artifacts/material-instruments --repeats 3
      - run: python -m scripts.evaluate_paper_methods --output artifacts/paper-evaluation/synthetic.json
      - run: python -m scripts.evaluate_reliability --output artifacts/reliability-evaluation
      - run: python -m scripts.evaluate_design --output artifacts/design-evaluation
      - run: python -m scripts.evaluate_agent_boundaries > artifacts/agent-boundaries.json
      - run: python -m scripts.render_paper_gallery --output artifacts/paper-figures
      - run: python -m scripts.qa_paper_gallery
      - run: python -m scripts.run_example examples/dirty_quality_flow.json --output artifacts/dirty_report.json
      - run: python -m scripts.run_example examples/mechanics/dirty_flow.json --output artifacts/mechanics_dirty.json
      - run: python -m scripts.run_example examples/mechanics/corrected_flow.json --output artifacts/mechanics_corrected.json
      - run: python -m build --wheel
      - run: python -m pip install --force-reinstall --no-deps dist/*.whl
      - run: python -m scripts.verify_install --require-wheel
      - uses: actions/upload-artifact@v4
        with:
          name: materials-quality-verification
          path: |
            materials-quality/artifacts/*.json
            materials-quality/artifacts/paper-figures/
            materials-quality/artifacts/paper-qa/
            materials-quality/dist/*.whl
            materials-quality/artifacts/reliability-evaluation/
            materials-quality/artifacts/design-evaluation/
            materials-quality/artifacts/paper-evaluation/
            materials-quality/artifacts/demo-reference-evaluation/
            materials-quality/artifacts/agent-stability/
            materials-quality/artifacts/material-instruments/
